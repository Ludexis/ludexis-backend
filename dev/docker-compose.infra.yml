services:
  db:
    image: postgres:16
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      POSTGRES_USER: ludexis
      POSTGRES_PASSWORD: ludexis
      POSTGRES_DB: ludexis

    volumes:
      - db_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludexis"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ../monitoring/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped

    ports:
      - "9100:9100"

  windows-exporter:
    image: prometheuscommunity/windows-exporter:latest
    restart: unless-stopped

    profiles:
      - windows_exporter

    ports:
      - "9182:9182"

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
