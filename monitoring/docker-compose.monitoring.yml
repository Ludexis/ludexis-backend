services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ludexis-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: ludexis-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ludexis-node-exporter
    restart: unless-stopped

    ports:
      - "9100:9100"

  windows-exporter:
    image: prometheuscommunity/windows-exporter:latest
    container_name: ludexis-windows-exporter
    restart: unless-stopped

    profiles:
      - windows_exporter

    ports:
      - "9182:9182"

volumes:
  prometheus_data:
  grafana_data:
