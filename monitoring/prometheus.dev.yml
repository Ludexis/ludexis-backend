global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ludexis-backend"
    metrics_path: /api/metrics

    static_configs:
      - targets:
          - host.docker.internal:8000

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: "windows-exporter"
    static_configs:
      - targets:
          - windows-exporter:9182
